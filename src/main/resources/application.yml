server:
  port: 8080

spring:
  application:
    name: mpcss-consumer-service

  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://mpclrmqtest.cbonet.cboroot.om:4443?sslEnabled=true&trustStorePath=${ARTEMIS_TRUSTSTORE_PATH:classpath:keystore/mpcss-truststore.p12}&trustStorePassword=${ARTEMIS_TRUSTSTORE_PASSWORD:changeit}&keyStorePath=${ARTEMIS_KEYSTORE_PATH:classpath:keystore/mpcss-keystore.p12}&keyStorePassword=${ARTEMIS_KEYSTORE_PASSWORD:changeit}}
    # Certificate-based authentication - no username/password required

  jms:
    listener:
      acknowledge-mode: client
      concurrency: 1
      max-concurrency: 5

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/mpcss_consumer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Muscat}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# MPCSS Configuration
mpcss:
  participant:
    short-name: ${MPCSS_PARTICIPANT_SHORT_NAME:opay}
    numeric-code: ${MPCSS_PARTICIPANT_CODE:OPAY}
    bic: ${MPCSS_PARTICIPANT_BIC:OMPAYOMR}
    participant-id: ${MPCSS_PARTICIPANT_ID:OMPAYOMR}
    routing-code: ${MPCSS_ROUTING_CODE:OPAY}

  # Static/default values from A2A migration (Excel Tab 2 - non clear fields mapping)
  defaults:
    registration-code: ${MPCSS_DEFAULT_REGISTRATION_CODE:OPAY001}
    account-banked: ${MPCSS_DEFAULT_ACCOUNT_BANKED:true}
    currency: ${MPCSS_DEFAULT_CURRENCY:OMR}
    batch-source: ${MPCSS_DEFAULT_BATCH_SOURCE:20}
    session-sequence: ${MPCSS_DEFAULT_SESSION_SEQUENCE:2955}

  queues:
    # Inward queues (messages FROM PS-mpClear TO participant) - We CONSUME from these
    payment-inward: mpc.${mpcss.participant.short-name}.payment.inward
    reply-inward: mpc.${mpcss.participant.short-name}.reply.inward
    registration-inward: mpc.${mpcss.participant.short-name}.reg.inward
    bulk-registration-inward: mpc.${mpcss.participant.short-name}.regfile.inward
    heartbeat-inward: mpc.${mpcss.participant.short-name}.heartbeat.inward
    payment-enquiry-inward: mpc.${mpcss.participant.short-name}.paymentenquiry.inward
    customer-name-inward: mpc.${mpcss.participant.short-name}.customername.inward
    check-default-inward: mpc.${mpcss.participant.short-name}.checkdefault.inward
    reports-inward: mpc.${mpcss.participant.short-name}.reports.inward

    # Outward queues (messages FROM participant TO PS-mpClear) - We PRODUCE to these
    payment-outward: mpc.${mpcss.participant.short-name}.payment.outward
    reply-outward: mpc.${mpcss.participant.short-name}.reply.outward
    registration-outward: mpc.${mpcss.participant.short-name}.reg.outward
    bulk-registration-outward: mpc.${mpcss.participant.short-name}.regfile.outward
    heartbeat-outward: mpc.${mpcss.participant.short-name}.heartbeat.outward
    payment-enquiry-outward: mpc.${mpcss.participant.short-name}.paymentenquiry.outward
    customer-name-outward: mpc.${mpcss.participant.short-name}.customername.outward
    check-default-outward: mpc.${mpcss.participant.short-name}.checkdefault.outward

  signature:
    enabled: ${MPCSS_SIGNATURE_ENABLED:true}
    algorithm: SHA256withRSA
    keystore-type: ${MPCSS_KEYSTORE_TYPE:PKCS12}
    keystore-path: ${MPCSS_KEYSTORE_PATH:classpath:keystore/mpcss-keystore.p12}
    keystore-password: ${MPCSS_KEYSTORE_PASSWORD:changeit}
    key-alias: ${MPCSS_KEY_ALIAS:mpcss-participant}
    key-password: ${MPCSS_KEY_PASSWORD:changeit}
    truststore-type: ${MPCSS_TRUSTSTORE_TYPE:PKCS12}
    truststore-path: ${MPCSS_TRUSTSTORE_PATH:classpath:keystore/mpcss-truststore.p12}
    truststore-password: ${MPCSS_TRUSTSTORE_PASSWORD:changeit}

  # Downstream core banking service
  core-banking:
    base-url: ${CORE_BANKING_URL:http://localhost:8081/api/v1}
    timeout-seconds: ${CORE_BANKING_TIMEOUT:30}

# Logging
logging:
  level:
    mobi.foo.mpcss: DEBUG
    org.apache.activemq: INFO
    org.springframework.jms: DEBUG
    org.hibernate.SQL: DEBUG
